<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f8fafc; }
  body {
    width: 560px; padding: 40px 32px 48px;
    font-family: "Noto Sans Thai", "Sukhumvit Set", "Helvetica Neue", Arial, sans-serif;
    color: #0f172a;
  }
  .tag { font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
         color: #64748b; font-weight: 700; text-align: center; margin-bottom: 10px; }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 28px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
          padding: 24px; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .card h2 { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
  label { display: block; margin-bottom: 14px; }
  .label-text { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; }
  .field { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 12px; font-size: 15px; color: #0f172a; }
  .field.error { border-color: #dc2626; }
  .err { font-size: 12px; color: #dc2626; margin-top: 4px; }
  .submit { width: 100%; margin-top: 6px; padding: 10px; border-radius: 8px; border: none;
            background: #d1d5db; color: #6b7280; font-weight: 700; text-align: center; font-size: 15px; }
  .success { margin-top: 14px; font-size: 13px; color: #16a34a; font-weight: 600; text-align: center; }
  .note { margin-top: 24px; font-size: 12px; color: #94a3b8; text-align: center; }
</style></head>
<body>
  <div class="tag">Mockup · Lab Day 2</div>
  <h1>สมัครสมาชิก</h1>
  <p class="sub">ฟิลด์ทั้งหมด controlled + validate เอง — error ใต้ช่องที่ผิด, submit ต้องถูกกันจริงใน handleSubmit</p>
  <div class="card">
    <h2>สมัครสมาชิก</h2>

    <label>
      <span class="label-text">ชื่อ</span>
      <div class="field">สมชาย ใจดี</div>
    </label>

    <label>
      <span class="label-text">อีเมล</span>
      <div class="field error">somchai#email</div>
      <div class="err">อีเมลไม่ถูกต้อง</div>
    </label>

    <label>
      <span class="label-text">อายุ</span>
      <div class="field">25</div>
    </label>

    <label>
      <span class="label-text">เบอร์โทร</span>
      <div class="field error">081234</div>
      <div class="err">เบอร์โทรต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0</div>
    </label>

    <div class="submit">สมัคร</div>
  </div>
  <p class="note">มี error ค้างอยู่ 1 ช่องขึ้นไป → ปุ่มต้อง disabled และ submit ต้องไม่ผ่านแม้ปิด JS/DevTools</p>
</body></html>
