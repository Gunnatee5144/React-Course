<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 560px; padding: 40px 32px 48px;
    font-family: "Noto Sans Thai", "Sukhumvit Set", "Helvetica Neue", Arial, sans-serif;
    background: #f8fafc; color: #0f172a;
  }
  .tag { font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
         color: #64748b; font-weight: 700; text-align: center; margin-bottom: 10px; }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 28px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
          padding: 24px; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .card h2 { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
  label { display: block; margin-bottom: 14px; }
  .label-text { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; }
  .field { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 12px; font-size: 15px; color: #0f172a; }
  .presets { display: flex; gap: 8px; margin-top: 6px; }
  .preset { padding: 6px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 600; color: #334155; }
  .preset.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .results { border-top: 1px solid #e2e8f0; margin-top: 20px; padding-top: 16px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; color: #334155; padding: 4px 0; }
  .row.total { font-size: 18px; font-weight: 700; color: #0f172a; }
  .reset { width: 100%; margin-top: 18px; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;
           background: #fff; color: #334155; font-weight: 600; text-align: center; }
  .note { margin-top: 24px; font-size: 12px; color: #94a3b8; text-align: center; }
</style></head>
<body>
  <div class="tag">Mockup · Lab Day 2</div>
  <h1>คำนวณทิป</h1>
  <p class="sub">ทุกช่องเป็น controlled input — คำนวณสดทันทีที่พิมพ์ ไม่ต้องกดปุ่ม</p>
  <div class="card">
    <h2>คำนวณทิป</h2>

    <label>
      <span class="label-text">ยอดบิล (บาท)</span>
      <div class="field">450</div>
    </label>

    <label>
      <span class="label-text">ทิป 15%</span>
      <div class="presets">
        <div class="preset">10%</div>
        <div class="preset active">15%</div>
        <div class="preset">20%</div>
      </div>
    </label>

    <label>
      <span class="label-text">จำนวนคน</span>
      <div class="field">3</div>
    </label>

    <div class="results">
      <div class="row"><span>ทิป</span><span>67.50 บาท</span></div>
      <div class="row"><span>ยอดรวม</span><span>517.50 บาท</span></div>
      <div class="row total"><span>คนละ</span><span>172.50 บาท</span></div>
    </div>

    <div class="reset">รีเซ็ต</div>
  </div>
  <p class="note">บิลว่างหรือคนเป็น 0 ต้องไม่ขึ้น NaN/Infinity ที่ไหนในหน้าเด็ดขาด</p>
</body></html>
